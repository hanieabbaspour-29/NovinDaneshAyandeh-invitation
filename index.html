
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوت‌نامه | نوین دانش آینده</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #f6f3ec;
      color: #172d49;
      font-family: Tahoma, sans-serif;
      text-align: center;
      line-height: 2;
    }

    main {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      margin-top: 45px;
      font-size: 30px;
    }

    video {
      width: 100%;
      margin: 25px 0;
      border-radius: 8px;
      background: #172d49;
    }

    .message {
      max-width: 600px;
      margin: 30px auto;
    }
  </style>
</head>

<body>
  <main>
    <p>NOVIN DANESH AYANDEH</p>

    <h1>دعوت به مراسم</h1>

    <p>با افتخار از شما دعوت می‌کنیم در این رویداد همراه ما باشید.</p>

    <video controls playsinline preload="metadata">
      <source src="invitation.mp4" type="video/mp4">
      مرورگر شما امکان پخش ویدیو را ندارد.
    </video>

    <section class="message">
      <h2>دعوت‌نامه رسمی</h2>
      <p>
        متن رسمی دعوت‌نامه شما در این قسمت قرار می‌گیرد.
      </p>
      <p>تاریخ: [تاریخ مراسم]</p>
      <p>ساعت: [ساعت مراسم]</p>
      <p>محل برگزاری: [آدرس مراسم]</p>
    </section>
  </main>
</body>
</html>
